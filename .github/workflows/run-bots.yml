name: Run Click Bots

on:
  workflow_dispatch:   # Manual trigger from GitHub UI
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (optional)

jobs:
  run-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run bots
        env:
          HEADLESS: true
          WAIT_SECONDS: 10
          # Add proxies as GitHub Secrets later
          # PROXY_1: ${{ secrets.PROXY_1 }}
          # PROXY_2: ${{ secrets.PROXY_2 }}
        run: |
          python main.py --bots 5
